<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · TinaTwit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="login-toggle-mode" id="themeBtn">
    <span class="icon" id="themeIcon"></span>
    <span id="themeLabel">Dark</span>
  </button>

  <div class="login-wrapper">
    <div class="login-hero">
      <svg viewBox="0 0 24 24"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/></svg>
    </div>
    <div class="login-form-box">
      <h1>Sign in to NgaboTwit</h1>
      <p class="login-error" id="loginError"></p>
      <input type="text" id="username" class="login-input" placeholder="Username" autocomplete="username">
      <input type="password" id="password" class="login-input" placeholder="Password" autocomplete="current-password">
      <button class="login-submit" id="loginBtn">Sign in</button>
      <p style="margin-top:16px; color: var(--text-secondary); font-size:14px;">
        Hint: any username + password (min 4 characters) works — this is a demo login 😉
      </p>
    </div>
  </div>

<script>
  const sunSVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  const moonSVG = '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

  function setThemeButton(theme) {
    document.getElementById('themeIcon').innerHTML = theme === 'dark' ? sunSVG : moonSVG;
    document.getElementById('themeLabel').textContent = theme === 'dark' ? 'Light' : 'Dark';
  }

  const savedTheme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  setThemeButton(savedTheme);

  document.getElementById('themeBtn').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    setThemeButton(next);
  });

  document.getElementById('loginBtn').addEventListener('click', handleLogin);
  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

  function handleLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorEl = document.getElementById('loginError');

    if (!username || !password) {
      errorEl.textContent = "Please fill in both fields.";
      return;
    }
    if (password.length < 4) {
      errorEl.textContent = "Password must be at least 4 characters.";
      return;
    }

    localStorage.setItem('ngaboUser', JSON.stringify({ username, loggedInAt: Date.now() }));
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
